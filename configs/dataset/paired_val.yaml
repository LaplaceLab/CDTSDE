dataset:
  target: dataset.paired_dataset.PairedDataset
  params:
    pair_list_path: data/pair_list_val.txt
    out_size: 256
    crop_type: center
data_loader:
  batch_size: 8
  shuffle: false
  num_workers: 16
  prefetch_factor: 2
  drop_last: true
batch_transform:
  target: dataset.batch_transform_new.PairedBatchTransform
  params: {}
